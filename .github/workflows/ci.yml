name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/DataLooMStudio.Web/package-lock.json

      - name: Restore backend
        run: dotnet restore DataLooMStudio.slnx

      - name: Build backend
        run: dotnet build DataLooMStudio.slnx --configuration Release --no-restore

      - name: Test backend
        run: dotnet test DataLooMStudio.slnx --configuration Release --no-build --logger trx

      - name: Audit backend packages
        run: dotnet list DataLooMStudio.slnx package --vulnerable --include-transitive

      - name: Install frontend
        working-directory: src/Web/DataLooMStudio.Web
        run: npm ci

      - name: Build frontend
        working-directory: src/Web/DataLooMStudio.Web
        run: npm run build

      - name: Audit frontend packages
        working-directory: src/Web/DataLooMStudio.Web
        run: npm audit --audit-level=high

      - name: Build Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep
